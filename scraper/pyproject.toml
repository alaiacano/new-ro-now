[project]
name = "new-ro-scraper"
version = "0.1.0"
description = "Scraper for New Rochelle, NY city data"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "icalendar>=5.0",
    "rich>=13.0",
    "python-dateutil>=2.9",
    "pypdf>=4.0",
]

[project.scripts]
scrape = "scraper.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper"]
